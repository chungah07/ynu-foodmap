<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영남대 맛집지도 🍜 - YNU FoodMap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #ff6b35;
            --accent2: #f7c948;
            --text: #e8e8f0;
            --text2: #8892b0;
            --border: #2a2a4a;
            --green: #4caf50;
            --red: #f44336;
            --blue: #4a8aff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; overflow: hidden;
        }

        .header {
            height: 56px; background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 16px; z-index: 1000;
            justify-content: space-between;
        }
        .header .logo { font-size: 20px; font-weight: 700; color: var(--accent); }
        .header .logo i { margin-right: 6px; }
        .header .auth-area { display: flex; gap: 8px; align-items: center; }
        .btn {
            padding: 8px 14px; border: none; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex;
            align-items: center; gap: 6px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #ff7f50; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 6px; }
        .user-badge {
            display: flex; align-items: center; gap: 6px; padding: 4px 10px;
            background: rgba(255,107,53,0.15); border-radius: 20px; cursor: pointer;
        }
        .user-badge .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
        .user-badge .rank { font-size: 11px; color: var(--accent2); }

        .main { display: flex; height: calc(100vh - 56px); position: relative; }

        .sidebar {
            width: 380px; min-width: 380px; background: var(--card);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            overflow: hidden; z-index: 100;
        }
        .sidebar .filters {
            padding: 12px; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px;
        }
        .filter-row {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .filter-chip {
            padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px;
            font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg);
            color: var(--text2); transition: all 0.15s; white-space: nowrap;
        }
        .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .filter-chip:hover:not(.active) { border-color: #555; color: var(--text); }
        .search-box {
            display: flex; gap: 6px;
        }
        .search-box input {
            flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text); font-size: 13px; outline: none;
        }
        .search-box input:focus { border-color: var(--accent); }
        .restaurant-list {
            flex: 1; overflow-y: auto; padding: 8px 12px;
        }
        .restaurant-list::-webkit-scrollbar { width: 4px; }
        .restaurant-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .restaurant-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
        }
        .restaurant-card:hover { border-color: var(--accent); background: #1f1f3a; }
        .restaurant-card .name { font-size: 15px; font-weight: 700; color: var(--text); }
        .restaurant-card .meta { display: flex; gap: 10px; margin-top: 4px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
        .restaurant-card .meta i { margin-right: 3px; }
        .restaurant-card .tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .tag.solo { background: rgba(76,175,80,0.15); color: var(--green); }
        .tag.budget { background: rgba(247,201,72,0.15); color: var(--accent2); }

        .map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 2000; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card); border-radius: 16px; padding: 24px;
            width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto;
            border: 1px solid var(--border); position: relative;
        }
        .modal h2 { font-size: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .modal .close-btn {
            position: absolute; top: 16px; right: 16px; background: none; border: none;
            color: var(--text2); font-size: 20px; cursor: pointer;
        }
        .modal .close-btn:hover { color: var(--text); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text); font-size: 14px; outline: none;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .star-rating { display: flex; gap: 4px; cursor: pointer; }
        .star-rating i { font-size: 24px; color: var(--border); transition: color 0.15s; }
        .star-rating i.active { color: var(--accent2); }
        .auth-provider {
            display: flex; align-items: center; gap: 12px; padding: 14px;
            border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
            margin-bottom: 8px; transition: all 0.15s;
        }
        .auth-provider:hover { background: var(--bg); border-color: var(--accent); }
        .auth-provider i { font-size: 20px; }
        .auth-provider.google i { color: #4285f4; }
        .auth-provider.apple i { color: #fff; }
        .auth-provider.anonymous i { color: var(--text2); }
        .divider { text-align: center; color: var(--text2); font-size: 12px; margin: 12px 0; }
        .rank-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 8px;
        }
        .rank-badge.lv1 { background: rgba(255,107,53,0.15); color: var(--accent); }
        .rank-badge.lv2 { background: rgba(247,201,72,0.15); color: var(--accent2); }
        .rank-badge.lv3 { background: rgba(76,175,80,0.15); color: var(--green); }
        .rank-badge.lv4 { background: rgba(74,138,255,0.15); color: var(--blue); }
        .rank-badge.lv5 { background: rgba(255,107,53,0.25); color: #ffd700; }
        .review-item {
            background: var(--bg); border-radius: 8px; padding: 10px; margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .review-item .reviewer { font-size: 12px; color: var(--accent); font-weight: 600; }
        .review-item .review-text { font-size: 13px; margin: 4px 0; color: var(--text); }
        .review-item .review-meta { font-size: 11px; color: var(--text2); }
        .empty-state { text-align: center; padding: 30px; color: var(--text2); }
        .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; }
        .fab {
            position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px;
            border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px;
            border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(255,107,53,0.4);
            z-index: 1500; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .fab:hover { transform: scale(1.1); }
        .fab:active { transform: scale(0.95); }
        .toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 8px;
            font-size: 13px; font-weight: 600; z-index: 3000; opacity: 0;
            transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* Distance legend on map */
        .dist-legend {
            position: absolute; bottom: 12px; left: 12px; z-index: 1000;
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 6px 10px; font-size: 11px; color: var(--text2); pointer-events: none;
        }
        .dist-legend span { margin: 0 4px; }
        .dist-legend b { color: var(--accent); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: 100%; max-height: 45%; border-right: none; border-bottom: 1px solid var(--border); }
            .main { flex-direction: column-reverse; }
            .map-container { height: 55%; }
            .fab { bottom: 16px; right: 16px; width: 48px; height: 48px; font-size: 20px; }
            .modal { max-width: 100%; margin: 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><i class="fa-solid fa-utensils"></i> YNU FoodMap</div>
        <div class="auth-area" id="authArea">
            <button class="btn btn-outline btn-sm" onclick="openAuth()" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket"></i> 로그인
            </button>
            <div class="user-badge" style="display:none" id="userBadge" onclick="openProfile()">
                <div class="avatar" id="avatarIcon">👤</div>
                <div>
                    <div style="font-size:13px;font-weight:600" id="displayName">익명</div>
                    <div class="rank" id="rankShort">새내기</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div class="filters">
                <div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px">🏫 기준: 학교 캠퍼스 바깥라인</div>
                <div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px">🔍 거리 (학교 바깥에서부터)</div>
                <div class="filter-row" id="distFilters">
                    <button class="filter-chip active" data-dist="1" onclick="setDist(1)">~1km</button>
                    <button class="filter-chip" data-dist="3" onclick="setDist(3)">~3km</button>
                </div>
                <div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px">🏷 카테고리</div>
                <div class="filter-row" id="catFilters">
                    <button class="filter-chip active" data-cat="" onclick="setCat('')">전체</button>
                    <button class="filter-chip" data-cat="한식" onclick="setCat('한식')">🍚 한식</button>
                    <button class="filter-chip" data-cat="중식" onclick="setCat('중식')">🥡 중식</button>
                    <button class="filter-chip" data-cat="일식" onclick="setCat('일식')">🍣 일식</button>
                    <button class="filter-chip" data-cat="양식" onclick="setCat('양식')">🍝 양식</button>
                    <button class="filter-chip" data-cat="분식" onclick="setCat('분식')">🍢 분식</button>
                    <button class="filter-chip" data-cat="술집" onclick="setCat('술집')">🍺 술집</button>
                    <button class="filter-chip" data-cat="단체" onclick="setCat('단체')">👥 단체OK</button>
                    <button class="filter-chip" data-cat="혼밥" onclick="setCat('혼밥')">🧑‍🍳 혼밥</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 식당 이름, 메뉴 검색..." oninput="doSearch()">
                    <button class="btn btn-primary btn-sm" onclick="openAddRestaurant()">
                        <i class="fa-solid fa-plus"></i> 추가
                    </button>
                </div>
            </div>
            <div class="restaurant-list" id="restaurantList"></div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            <div class="dist-legend" id="distLegend">
                🟠 <b>캠퍼스</b> <span>|</span> 🔵 <b>1km</b> 버퍼 <span>|</span> 🟢 <b>3km</b>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openAddRestaurant()"><i class="fa-solid fa-plus"></i></button>
    <div class="toast" id="toast"></div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('authModal')"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-right-to-bracket"></i> 로그인 / 가입</h2>
            <div class="auth-provider google" onclick="loginWith('google')">
                <i class="fa-brands fa-google"></i>
                <div><strong>Google 계정으로 계속</strong><br><span style="font-size:11px;color:var(--text2)">@gmail.com 계정 사용</span></div>
            </div>
            <div class="auth-provider apple" onclick="loginWith('apple')">
                <i class="fa-brands fa-apple"></i>
                <div><strong>Apple 계정으로 계속</strong><br><span style="font-size:11px;color:var(--text2)">Apple ID 사용</span></div>
            </div>
            <div class="divider">──── 또는 ────</div>
            <div class="auth-provider anonymous" onclick="loginWith('anonymous')">
                <i class="fa-solid fa-user-secret"></i>
                <div><strong>익명으로 시작하기</strong><br><span style="font-size:11px;color:var(--text2)">별명으로 활동, 언제든 계정 연동 가능</span></div>
            </div>
            <p style="margin-top:12px;font-size:11px;color:#888">⚡ 현재 로컬 모드로 동작해요.</p>
        </div>
    </div>

    <!-- Add Restaurant Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('addModal')"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-store"></i> 새 맛집 추가</h2>
            <div class="form-group"><label>🍜 식당 이름 *</label><input type="text" id="addName" placeholder="ex) 영남반점"></div>
            <div class="form-group"><label>📍 주소 / 위치 설명</label><input type="text" id="addAddr" placeholder="ex) 경산시 대동 123-4"></div>
            <div class="form-group"><label>🍽 대표 메뉴</label><input type="text" id="addMenu" placeholder="ex) 짜장면 6,000원"></div>
            <div class="form-group"><label>💰 가격대</label><select id="addPrice">
                <option value="">선택</option><option value="만원 미만">만원 미만</option><option value="1~2만원">1~2만원</option><option value="2~3만원">2~3만원</option><option value="3만원 이상">3만원 이상</option>
            </select></div>
            <div class="form-group"><label>🏷 카테고리</label><select id="addCategory">
                <option value="">선택</option><option value="한식">🍚 한식</option><option value="중식">🥡 중식</option><option value="일식">🍣 일식</option><option value="양식">🍝 양식</option><option value="분식">🍢 분식</option><option value="술집">🍺 술집</option><option value="카페">☕ 카페</option>
            </select></div>
            <div class="form-group"><label>🧑‍🍳 혼밥 가능?</label><select id="addSolo">
                <option value="yes">✅ 혼밥 OK</option><option value="maybe">🤔 보통</option><option value="no">❌ 혼밥 어려움</option>
            </select></div>
            <div class="form-group"><label>📸 사진 URL (선택)</label><input type="text" id="addPhoto" placeholder="https://..."></div>
            <div class="form-group"><label>⭐ 내 평점</label>
                <div class="star-rating" id="addStars">
                    <i class="fa-solid fa-star" data-star="1" onclick="setAddRating(1)"></i>
                    <i class="fa-solid fa-star" data-star="2" onclick="setAddRating(2)"></i>
                    <i class="fa-solid fa-star" data-star="3" onclick="setAddRating(3)"></i>
                    <i class="fa-solid fa-star" data-star="4" onclick="setAddRating(4)"></i>
                    <i class="fa-solid fa-star" data-star="5" onclick="setAddRating(5)"></i>
                </div>
            </div>
            <div class="form-group"><label>📝 한줄평</label><textarea id="addReview" placeholder="이 식당 어땠나요?"></textarea></div>
            <div class="form-group"><label>📍 지도상 위치 (위도, 경도)</label><input type="text" id="addCoords" placeholder="35.8314, 128.7547"></div>
            <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="submitRestaurant()">
                <i class="fa-solid fa-check"></i> 맛집 등록하기
            </button>
        </div>
    </div>

    <!-- Restaurant Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" id="detailContent"></div>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal" id="profileContent"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>
    // ===== CAMPUS POLYGON =====
    const CAMPUS_POLYGON = [
        [35.8352, 128.7465], // 북서쪽 (정문 위쪽)
        [35.8358, 128.7495], // 북쪽
        [35.8360, 128.7528], // 북동쪽
        [35.8350, 128.7550], // 동북쪽
        [35.8333, 128.7570], // 동쪽 (운동장 방면)
        [35.8312, 128.7585], // 동남쪽
        [35.8285, 128.7595], // 후문 아래
        [35.8268, 128.7588], // 남동쪽
        [35.8258, 128.7560], // 남쪽
        [35.8250, 128.7525], // 남서쪽
        [35.8252, 128.7490], // 서남쪽
        [35.8265, 128.7465], // 서쪽
        [35.8288, 128.7448], // 북서쪽 (정문 왼쪽)
        [35.8320, 128.7450], // 정문 왼쪽 위
        [35.8352, 128.7465]  // 닫기
    ];

    // Campus center for initial view
    const CAMPUS_CENTER = [35.8305, 128.7520];

    const RANKS = [
        { min: 0,  icon: '🌱', name: '새내기 미식가', lv: 1 },
        { min: 5,  icon: '🔍', name: '맛집 탐험가', lv: 2 },
        { min: 15, icon: '⭐', name: '미식의 달인', lv: 3 },
        { min: 30, icon: '👑', name: '푸드 마스터', lv: 4 },
        { min: 50, icon: '🏆', name: '영남대 미식왕', lv: 5 },
    ];

    // ===== STATE =====
    const DATA_VERSION = 3; // bump when restaurant data changes
    let currentDist = 1;
    let currentCat = '';
    let storedVersion = parseInt(localStorage.getItem('ynu_version') || '0');
    let restaurants = (storedVersion >= DATA_VERSION)
        ? loadFromStorage('ynu_restaurants', defaultRestaurants())
        : saveLoadDefaults();
    let reviews = loadFromStorage('ynu_reviews', {});
    let user = loadFromStorage('ynu_user', { name: '익명', email: null, provider: 'anonymous', photo: null, reviews: 0 });

    function saveLoadDefaults() {
        const defs = defaultRestaurants();
        saveToStorage('ynu_restaurants', defs);
        localStorage.setItem('ynu_version', DATA_VERSION.toString());
        return defs;
    }

    function defaultRestaurants() {
        return [
            // ==== 정문/영남대역 주변 (청운로, 대학로) ====
            { id:1, name:'카츠디나인', lat:35.8298, lng:128.7545, menu:'수제돈까스', price:'1~2만원', solo:'yes', addr:'경산시 청운로 5 (대동 166-4)', tags:'일식', photo:null },

    // ===== STORAGE =====
    function saveToStorage(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
    function loadFromStorage(key, fallback) {
        try { let d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; }
        catch(e) { return fallback; }
    }

    // ===== DISTANCE TO POLYGON =====
    function distanceToPolygon(lat, lng, polygon) {
        const pt = turf.point([lng, lat]);
        const poly = turf.polygon([polygon.map(p => [p[1], p[0]])]); // swap to [lng,lat]
        // Find nearest point on polygon
        const nearest = turf.nearestPointOnLine(turf.polygonToLine(poly), pt);
        const distKm = turf.distance(pt, nearest, {units: 'kilometers'});
        // If point is inside polygon, return 0
        if (turf.booleanPointInPolygon(pt, poly)) return 0;
        return distKm;
    }

    // ===== MAP =====
    const map = L.map('map', { zoomControl: true }).setView(CAMPUS_CENTER, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap | 🍜 YNU FoodMap',
        maxZoom: 19
    }).addTo(map);

    // Draw campus polygon
    const campusLayer = L.polygon(CAMPUS_POLYGON, {
        color: '#ff6b35',
        fillColor: '#ff6b35',
        fillOpacity: 0.12,
        weight: 2,
        dashArray: null
    }).addTo(map).bindPopup('<b>🏫 영남대학교 캠퍼스</b><br>경산시 대학로 280');

    // Draw buffer polygons
    let bufferLayers = [];
    function updateBuffers() {
        bufferLayers.forEach(l => map.removeLayer(l));
        bufferLayers = [];

        const poly = turf.polygon([CAMPUS_POLYGON.map(p => [p[1], p[0]])]);

        // Show the selected buffer highlighted
        try {
            const buf = turf.buffer(poly, currentDist, {units: 'kilometers', steps: 32});
            const coords = buf.geometry.coordinates[0].map(c => [c[1], c[0]]); // back to [lat,lng]
            const layer = L.polygon(coords, {
                color: '#4a8aff',
                fillColor: '#4a8aff',
                fillOpacity: 0.06,
                weight: 1.5,
                dashArray: '6 4'
            }).addTo(map);
            bufferLayers.push(layer);
        } catch(e) { console.log('Buffer error:', e); }

        // Draw all buffers faintly
        [1,3].forEach(dist => {
            if (dist === currentDist) return;
            try {
                const buf = turf.buffer(poly, dist, {units: 'kilometers', steps: 32});
                const coords = buf.geometry.coordinates[0].map(c => [c[1], c[0]]);
                const layer = L.polygon(coords, {
                    color: '#555',
                    fillColor: '#555',
                    fillOpacity: 0.02,
                    weight: 0.5,
                    dashArray: '3 8'
                }).addTo(map);
                bufferLayers.push(layer);
            } catch(e) {}
        });
    }

    let markers = [];
    function foodIcon(rating) {
        const color = rating >= 4 ? '#ff6b35' : rating >= 3 ? '#f7c948' : '#8892b0';
        return L.divIcon({
            className: '', html: `<div style="background:${color};color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid #fff">🍜</div>`,
            iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -15]
        });
    }

    function updateMarkers() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        const filtered = filterRestaurants();

        filtered.forEach(r => {
            const marker = L.marker([r.lat, r.lng], { icon: foodIcon(avgRating(r.id)) })
                .addTo(map)
                .bindPopup(`
                    <div style="min-width:160px">
                        <h3 style="color:#333;margin-bottom:4px">${r.name}</h3>
                        <p style="margin:2px 0"><b>🍽</b> ${r.menu}</p>
                        <p style="margin:2px 0"><b>💰</b> ${r.price}</p>
                        <p style="margin:2px 0"><b>⭐</b> ${avgRating(r.id).toFixed(1)} (${reviewCount(r.id)}개)</p>
                        <p style="margin:2px 0">${r.solo==='yes'?'✅ 혼밥OK':r.solo==='maybe'?'🤔보통':'❌ 혼밥 어려움'}</p>
                        <p style="margin:2px 0;font-size:11px;color:#888">📍 학교 밖 ${distLabel(r)}</p>
                        <button onclick="openDetail(${r.id})" style="background:#ff6b35;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;margin-top:4px">자세히 보기</button>
                    </div>`);
            markers.push(marker);
        });
    }

    function distLabel(r) {
        const d = distanceToPolygon(r.lat, r.lng, CAMPUS_POLYGON);
        if (d === 0) return '캠퍼스 내';
        if (d < 0.5) return `${(d*1000).toFixed(0)}m`;
        return `${d.toFixed(1)}km`;
    }

    // ===== FILTERS =====
    function setDist(dist) {
        currentDist = dist;
        document.querySelectorAll('#distFilters .filter-chip').forEach(b => b.classList.toggle('active', +b.dataset.dist === dist));
        updateBuffers();
        renderAll();

    function setCat(cat) {
        currentCat = cat;
        document.querySelectorAll('#catFilters .filter-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
        renderAll();
    }

    function filterRestaurants() {
        const term = (document.getElementById('searchInput')?.value || '').toLowerCase();
        return restaurants.filter(r => {
            const d = distanceToPolygon(r.lat, r.lng, CAMPUS_POLYGON);
            const inRange = d <= currentDist;
            let catMatch = true;
            if (currentCat) {
                if (currentCat === '혼밥') catMatch = r.solo === 'yes';
                else if (currentCat === '단체') catMatch = (r.tags||'').includes('단체');
                else catMatch = (r.tags||'').includes(currentCat);
            }
            const matchesSearch = !term || r.name.toLowerCase().includes(term) || r.menu.toLowerCase().includes(term) || (r.tags||'').includes(term);
            return inRange && catMatch && matchesSearch;
        });
    }

    function doSearch() { renderAll(); }

    // ===== AVERAGE RATING =====
    function avgRating(restId) {
        const r = reviews[restId] || [];
        if (!r.length) return 0;
        return r.reduce((s,x) => s + (x.rating||0), 0) / r.length;
    }
    function reviewCount(restId) { return (reviews[restId] || []).length; }

    // ===== RENDER =====
    function renderAll() { updateMarkers(); renderList(); }

    function renderList() {
        const list = document.getElementById('restaurantList');
        const filtered = filterRestaurants();
        if (!filtered.length) {
            list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i>이 거리에는 맛집이 없어요<br><span style="font-size:12px">거리를 넓히거나 새 맛집을 추가해보세요!</span></div>`;
            return;
        }
        list.innerHTML = filtered.map(r => {
            const avg = avgRating(r.id);
            const cnt = reviewCount(r.id);
            const d = distanceToPolygon(r.lat, r.lng, CAMPUS_POLYGON);
            const stars = avg > 0 ? '⭐'.repeat(Math.round(avg)) + ` ${avg.toFixed(1)}` : '尚无评分';
            return `
            <div class="restaurant-card" onclick="openDetail(${r.id})">
                <div class="name">${r.photo ? `<img src="${r.photo}" style="width:50px;height:50px;border-radius:8px;object-fit:cover;float:right;margin-left:8px">` : ''}${r.name}</div>
                <div class="meta">
                    <span><i class="fa-solid fa-utensils"></i> ${r.menu}</span>
                    <span><i class="fa-solid fa-won-sign"></i> ${r.price}</span>
                </div>
                <div class="meta" style="margin-top:2px">
                    <span><i class="fa-solid fa-star" style="color:var(--accent2)"></i> ${stars} (${cnt}리뷰)</span>
                    <span><i class="fa-solid fa-location-dot"></i> ${distLabel(r)}</span>
                </div>
                <div class="tags">
                    ${r.solo==='yes'?'<span class="tag solo">✅ 혼밥OK</span>':r.solo==='maybe'?'<span class="tag budget">🤔 보통</span>':''}
                    ${(r.tags||'').split('|').filter(Boolean).map(t=>`<span class="tag" style="background:rgba(74,138,255,0.1);color:var(--blue)">#${t}</span>`).join('')}
                </div>
            </div>`;
        }).join('');
    }

    function setReviewRating(n) {
        window._reviewRating = n;
        document.querySelectorAll('#reviewStars i').forEach((s,i) => s.classList.toggle('active', i < n));
    }

    function submitReview(id) {
        const text = document.getElementById('reviewText')?.value.trim();
        const rating = window._reviewRating || 0;
        if (!rating) return toastMsg('별점을 선택해주세요!');
        if (!reviews[id]) reviews[id] = [];
        reviews[id].push({
            user: user.name || '익명', rating, text,
            date: new Date().toISOString().slice(0,10)
        });
        saveToStorage('ynu_reviews', reviews);
        user.reviews = (user.reviews||0) + 1;
        saveToStorage('ynu_user', user);
        closeModal('detailModal');
        renderAll();
        updateUserUI();
        toastMsg('리뷰가 등록됐어요! 🎉');
    }

    function submitRestaurant() {
        const name = document.getElementById('addName').value.trim();
        if (!name) return toastMsg('식당 이름을 입력해주세요!');
        let lat = CAMPUS_CENTER[0] + (Math.random() - 0.5) * 0.008;
        let lng = CAMPUS_CENTER[1] + (Math.random() - 0.5) * 0.008;
        const coordsStr = document.getElementById('addCoords').value.trim();
        if (coordsStr) {
            const parts = coordsStr.split(',').map(Number);
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) { lat = parts[0]; lng = parts[1]; }
        }
        const newR = {
            id: Date.now(), name, lat, lng,
            menu: document.getElementById('addMenu').value.trim() || '메뉴 정보 없음',
            price: document.getElementById('addPrice').value || '',
            solo: document.getElementById('addSolo').value || 'maybe',
            addr: document.getElementById('addAddr').value.trim() || '',
            tags: document.getElementById('addCategory').value || '', photo: document.getElementById('addPhoto').value.trim() || null
        };
        restaurants.push(newR);
        saveToStorage('ynu_restaurants', restaurants);
        if (window._addRating > 0) {
            if (!reviews[newR.id]) reviews[newR.id] = [];
            reviews[newR.id].push({
                user: user.name || '익명', rating: window._addRating,
                text: document.getElementById('addReview').value.trim() || '',
                date: new Date().toISOString().slice(0,10)
            });
            saveToStorage('ynu_reviews', reviews);
            user.reviews = (user.reviews||0) + 1;
            saveToStorage('ynu_user', user);
        }
        closeModal('addModal');
        renderAll();
        updateUserUI();
        toastMsg(`🎉 "${name}" 등록 완료!`);
        ['addName','addAddr','addMenu','addPhoto','addReview','addCoords'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        window._addRating = 0;
        document.querySelectorAll('#addStars i').forEach(s => s.classList.remove('active'));
    }

    // ===== AUTH =====
    function openAuth() { document.getElementById('authModal').classList.add('open'); }
    function loginWith(provider) {
        if (provider === 'anonymous') {
            user = { name: '익명', email: null, provider: 'anonymous', photo: null, reviews: user.reviews||0 };
        } else {
            const mockName = provider === 'google' ? 'chunga.ryu@gmail.com' : 'apple_user@icloud.com';
            user = { name: mockName.split('@')[0], email: mockName, provider, photo: null, reviews: user.reviews||0 };
        }
        saveToStorage('ynu_user', user);
        closeModal('authModal');
        updateUserUI();
        toastMsg(`✅ ${provider === 'anonymous' ? '익명' : provider} 로그인 완료!`);
    }
    function updateUserUI() {
        const badge = document.getElementById('userBadge');
        const loginBtn = document.getElementById('loginBtn');
        const loggedIn = user.email || user.provider !== 'anonymous';
        loginBtn.style.display = loggedIn ? 'none' : '';
        badge.style.display = loggedIn ? 'flex' : 'none';
        const rank = getRank(user.reviews || 0);
        document.getElementById('displayName').textContent = user.email ? user.email.split('@')[0] : '익명';
        document.getElementById('rankShort').textContent = rank.icon + ' ' + rank.name;
        document.getElementById('avatarIcon').textContent = rank.icon;
    }
    function getRank(count) {
        let r = RANKS[0];
        for (let i = RANKS.length-1; i >= 0; i--) { if (count >= RANKS[i].min) { r = RANKS[i]; break; } }
        return r;
    }
    function openProfile() {
        const rank = getRank(user.reviews || 0);
        const nextRank = RANKS.find(r => r.min > (user.reviews||0));
        document.getElementById('profileContent').innerHTML = `
            <button class="close-btn" onclick="closeModal('profileModal')"><i class="fa-solid fa-xmark"></i></button>
            <h2>👤 내 프로필</h2>
            <div style="text-align:center;margin:16px 0">
                <div style="font-size:48px">${rank.icon}</div>
                <div style="font-size:18px;font-weight:700;margin-top:8px">${user.email ? user.email.split('@')[0] : '익명'}</div>
                <div class="rank-badge lv${rank.lv}"><i class="fa-solid fa-crown"></i> ${rank.name}</div>
                <div style="margin-top:12px;font-size:14px;color:var(--text2)">📝 작성한 리뷰: <strong>${user.reviews || 0}개</strong></div>
                ${nextRank ? `<div style="margin-top:8px;font-size:12px;color:var(--accent2)">다음 랭크까지 ${nextRank.min - (user.reviews||0)}개 남았어요!</div>` : '<div style="margin-top:8px;font-size:12px;color:#ffd700">🏆 최고 랭크 달성!</div>'}
            </div>
            <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:12px" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
        `;
        document.getElementById('profileModal').classList.add('open');
    }
    function logout() { user = { name: '익명', email: null, provider: 'anonymous', photo: null, reviews: 0 }; saveToStorage('ynu_user', user); closeModal('profileModal'); updateUserUI(); toastMsg('로그아웃 했어요'); }

    // ===== UTILS =====
    function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }
    function toastMsg(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    document.querySelectorAll('.modal-overlay').forEach(overlay => overlay.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); }));

    // ===== INIT =====
    updateUserUI();
    updateBuffers();
    renderAll();
    </script>
</body>
</html>
